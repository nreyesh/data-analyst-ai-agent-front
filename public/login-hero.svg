<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060A12"/>
      <stop offset="50%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00E599" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1200" height="1200" fill="url(#bgGrad)"/>
  <rect width="1200" height="1200" fill="url(#grid)"/>
  <circle cx="600" cy="540" r="520" fill="url(#emeraldGlow)"/>

  <!-- Glassmorphic Financial Ledger Card -->
  <rect x="180" y="250" width="840" height="640" rx="24" fill="#0F172A" fill-opacity="0.82" stroke="#00E599" stroke-opacity="0.28" stroke-width="2"/>
  
  <!-- Top Ledger Header Bar -->
  <rect x="230" y="300" width="220" height="14" rx="7" fill="#00E599" fill-opacity="0.8"/>
  <rect x="230" y="330" width="360" height="10" rx="5" fill="#94A3B8" fill-opacity="0.35"/>
  <circle cx="940" cy="315" r="8" fill="#00E599"/>
  <circle cx="910" cy="315" r="8" fill="#38BDF8" fill-opacity="0.6"/>

  <!-- Horizontal Reference Lines -->
  <line x1="230" y1="430" x2="970" y2="430" stroke="#94A3B8" stroke-opacity="0.12" stroke-dasharray="6 6"/>
  <line x1="230" y1="550" x2="970" y2="550" stroke="#94A3B8" stroke-opacity="0.12" stroke-dasharray="6 6"/>
  <line x1="230" y1="670" x2="970" y2="670" stroke="#94A3B8" stroke-opacity="0.12" stroke-dasharray="6 6"/>
  <line x1="230" y1="790" x2="970" y2="790" stroke="#94A3B8" stroke-opacity="0.25"/>

  <!-- Architectural Condominium & Expense Evolution Bars -->
  <rect x="270" y="620" width="56" height="170" rx="8" fill="url(#barGrad2)"/>
  <rect x="370" y="560" width="56" height="230" rx="8" fill="url(#barGrad2)"/>
  <rect x="470" y="590" width="56" height="200" rx="8" fill="url(#barGrad2)"/>
  <rect x="570" y="490" width="56" height="300" rx="8" fill="url(#barGrad1)"/>
  <rect x="670" y="440" width="56" height="350" rx="8" fill="url(#barGrad1)"/>
  <rect x="770" y="470" width="56" height="320" rx="8" fill="url(#barGrad1)"/>
  <rect x="870" y="380" width="56" height="410" rx="8" fill="url(#barGrad1)"/>

  <!-- Financial Evolution Trend Curve -->
  <path d="M 298 600 C 350 560, 380 540, 398 540 C 440 540, 470 570, 498 565 C 540 555, 570 475, 598 470 C 640 462, 670 420, 698 415 C 740 410, 770 450, 798 440 C 840 425, 875 365, 898 355" stroke="#00E599" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Data Nodes -->
  <circle cx="298" cy="600" r="7" fill="#0B1324" stroke="#38BDF8" stroke-width="4"/>
  <circle cx="398" cy="540" r="7" fill="#0B1324" stroke="#38BDF8" stroke-width="4"/>
  <circle cx="498" cy="565" r="7" fill="#0B1324" stroke="#38BDF8" stroke-width="4"/>
  <circle cx="598" cy="470" r="8" fill="#0B1324" stroke="#00E599" stroke-width="4"/>
  <circle cx="698" cy="415" r="8" fill="#0B1324" stroke="#00E599" stroke-width="4"/>
  <circle cx="798" cy="440" r="8" fill="#0B1324" stroke="#00E599" stroke-width="4"/>
  <circle cx="898" cy="355" r="10" fill="#00E599"/>

  <!-- Bottom Caption Pill: Comunidad Sierra Plaza en Español -->
  <rect x="320" y="940" width="560" height="54" rx="27" fill="#0F172A" stroke="#00E599" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="600" y="973" text-anchor="middle" fill="#F3F6FA" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" letter-spacing="2">COMUNIDAD SIERRA PLAZA — GASTOS COMUNES</text>
</svg>
