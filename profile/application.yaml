# ==============================================================================
# Baseline Application Configuration (Common Defaults)
# ==============================================================================
app:
  name: "building-analytics-frontend"
  version: "1.0.0"
  timeout_seconds: 60

server:
  host: "0.0.0.0"
  port: 8080

auth:
  provider: "firebase"
  identity_toolkit_url: "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword"
  token_lookup_url: "https://identitytoolkit.googleapis.com/v1/accounts:lookup"
  # Allow mock test accounts when running completely offline without internet
  allow_dev_mock_accounts: false
